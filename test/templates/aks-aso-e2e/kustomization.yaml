# Built inside a CAPZ checkout by make -C test generate-templates.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
- ../../flavors/aks-aso
- ../../flavors/aks-aso/credentials.yaml
- patches/worker-pools.yaml

patches:
- path: patches/pool1-delete.yaml
- target:
    kind: Cluster
  patch: |-
    - op: replace
      path: /spec/controlPlaneRef/apiVersion
      value: infrastructure.cluster.x-k8s.io/v1alpha1
    - op: replace
      path: /spec/infrastructureRef/apiVersion
      value: infrastructure.cluster.x-k8s.io/v1alpha1
- target:
    kind: AzureASOManagedCluster
  patch: |-
    - op: replace
      path: /apiVersion
      value: infrastructure.cluster.x-k8s.io/v1alpha1
    - op: test
      path: /spec/resources/0/kind
      value: ResourceGroup
    - op: add
      path: /spec/resources/0/spec/tags
      value:
        buildProvenance: ${BUILD_PROVENANCE}
        creationTimestamp: ${TIMESTAMP}
        jobName: ${JOB_NAME}
- target:
    kind: AzureASOManagedControlPlane
  patch: |-
    - op: replace
      path: /apiVersion
      value: infrastructure.cluster.x-k8s.io/v1alpha1
    - op: remove
      path: /spec/version
    - op: test
      path: /spec/resources/0/kind
      value: ManagedCluster
    - op: add
      path: /spec/resources/0/spec/kubernetesVersion
      value: ${KUBERNETES_VERSION}
    - op: add
      path: /spec/resources/0/spec/nodeResourceGroup
      value: MC_${CLUSTER_NAME}_${CLUSTER_NAME}_${AZURE_LOCATION}
    - op: replace
      path: /spec/resources/0/spec/identity
      value:
        type: UserAssigned
        userAssignedIdentities:
        - reference:
            armId: ${AZURE_CONTROL_PLANE_IDENTITY_ID}
    - op: add
      path: /spec/resources/0/spec/identityProfile
      value:
        kubeletidentity:
          resourceReference:
            armId: ${AZURE_KUBELET_IDENTITY_ID}
    - op: add
      path: /spec/resources/0/spec/sku
      value:
        name: Base
        tier: Free
    - op: add
      path: /spec/resources/0/spec/supportPlan
      value: ${AKS_SUPPORT_PLAN:=KubernetesOfficial}
    - op: add
      path: /spec/resources/0/spec/tags
      value:
        buildProvenance: ${BUILD_PROVENANCE}
        creationTimestamp: ${TIMESTAMP}
        jobName: ${JOB_NAME}
- target:
    kind: MachinePool
    name: .*pool0
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: add
      path: /metadata/annotations
      value:
        cluster.x-k8s.io/replicas-managed-by: cluster-autoscaler
    - op: replace
      path: /spec/template/spec/infrastructureRef/apiVersion
      value: infrastructure.cluster.x-k8s.io/v1alpha1
    - op: remove
      path: /spec/template/spec/version
- target:
    kind: AzureASOManagedMachinePool
    name: .*pool0
  patch: |-
    - op: replace
      path: /apiVersion
      value: infrastructure.cluster.x-k8s.io/v1alpha1
    - op: test
      path: /spec/resources/0/kind
      value: ManagedClustersAgentPool
    - op: replace
      path: /spec/resources/0/spec/vmSize
      value: ${AZURE_AKS_NODE_MACHINE_TYPE:=Standard_D2s_v5}
    - op: add
      path: /spec/resources/0/spec/orchestratorVersion
      value: ${KUBERNETES_VERSION}
- target:
    kind: Secret
  patch: |-
    - op: replace
      path: /stringData/AUTH_MODE
      value: podidentity

sortOptions:
  order: fifo
